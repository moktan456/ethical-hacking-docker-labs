# Alt Final 2026 Examination: Penetration Test — Vanta Health Pty Ltd
#
# Make-up sitting for students who missed final2026. Same five-phase chain,
# different company, network, credentials, password policy and privesc.
#
# Single isolated network (10.10.13.0/24). NO host ports are published.
#
# Flag chain (10 marks each, 50 total):
#   F1  web recon + username convention        (web   10.10.13.10)
#   F2  anonymous SMB share -> password policy (smb   10.10.13.11)
#   F3  Hydra SSH foothold (policy wordlist)   (ssh   10.10.13.12)
#   F4  SUID /bin/cp -> read root-only file    (ssh   10.10.13.12)
#   F5  cred reuse -> crack MD5 -> openssl dec (mysql 10.10.13.13)

services:
  attacker:
    image: ethical-base
    container_name: altfinal2026-attacker
    hostname: kali-attacker
    user: root
    cap_add:
      - NET_RAW
      - NET_ADMIN
    tty: true
    stdin_open: true
    networks:
      lab_network:
        ipv4_address: 10.10.13.2
    volumes:
      - ./lab-files:/root/lab
    environment:
      - DEBIAN_FRONTEND=noninteractive
    command: >
      /bin/bash -c "
      gunzip /usr/share/wordlists/rockyou.txt.gz 2>/dev/null || true &&
      echo 'Kali attacker ready! Use: docker exec -it altfinal2026-attacker bash' &&
      tail -f /dev/null"
    restart: unless-stopped

  web:
    image: httpd:2.4-bookworm
    container_name: altfinal2026-web
    hostname: vanta-web
    volumes:
      - ./web-content:/usr/local/apache2/htdocs:ro
    networks:
      lab_network:
        ipv4_address: 10.10.13.10
    restart: unless-stopped

  smb:
    image: ubuntu:22.04
    container_name: altfinal2026-smb
    hostname: vanta-fileshare
    environment:
      - DEBIAN_FRONTEND=noninteractive
    volumes:
      - ./smb-data:/data:ro
    command: >
      /bin/bash -c "
      apt-get update -qq &&
      apt-get install -y -q samba &&
      mkdir -p /srv/hr &&
      cp -r /data/* /srv/hr/ 2>/dev/null || true &&
      chmod -R 0555 /srv/hr &&
      printf '[global]\n   server string = Vanta Health File Server\n   workgroup = WORKGROUP\n   security = user\n   map to guest = Bad User\n   guest account = nobody\n   server role = standalone server\n   usershare allow guests = yes\n\n[hr]\n   comment = HR onboarding (staff only)\n   path = /srv/hr\n   browseable = yes\n   read only = yes\n   guest ok = yes\n   force user = nobody\n' > /etc/samba/smb.conf &&
      nmbd --daemon &&
      smbd --foreground --no-process-group"
    networks:
      lab_network:
        ipv4_address: 10.10.13.11
    restart: unless-stopped

  ssh-target:
    image: ubuntu:22.04
    container_name: altfinal2026-ssh
    hostname: vanta-app
    environment:
      - DEBIAN_FRONTEND=noninteractive
    command: >
      /bin/bash -c "
      apt-get update -qq &&
      apt-get install -y -q openssh-server sudo openssl mysql-client &&
      useradd -m -s /bin/bash rkhan &&
      echo 'rkhan:August2026' | chpasswd &&
      useradd -m -s /bin/bash mlin &&
      echo 'mlin:Xq7!txvX2monthsLater' | chpasswd &&
      echo 'flag{altfinal2026_ssh_foothold}' > /home/rkhan/user.txt &&
      chown rkhan:rkhan /home/rkhan/user.txt &&
      echo 'flag{altfinal2026_root_privesc}' > /root/root.txt &&
      chmod 600 /root/root.txt &&
      mkdir -p /opt/scripts &&
      printf '#!/bin/bash\n# Nightly vanta_db backup - do not edit (owner: rkhan)\nmysqldump -h 10.10.13.13 -u vhealth_app -pV@nta_db#2026 vanta_db > /opt/scripts/vanta_db.sql\n' > /opt/scripts/db_backup.sh &&
      chmod 0750 /opt/scripts/db_backup.sh &&
      chown rkhan:rkhan /opt/scripts/db_backup.sh &&
      mkdir -p /opt/vault &&
      printf 'Vanta Health Pty Ltd - Q4 patient billing export (CONFIDENTIAL)\nRecord,Clinic,Amount_AUD\nMRN-4471,Parkville,1820\nMRN-5590,Southbank,2640\nflag{altfinal2026_crack_decrypt}\n' > /tmp/pt_export.csv &&
      openssl enc -aes-256-cbc -salt -in /tmp/pt_export.csv -out /opt/vault/patient_export.enc -k princess &&
      rm -f /tmp/pt_export.csv &&
      chown rkhan:rkhan /opt/vault/patient_export.enc &&
      chmod 0640 /opt/vault/patient_export.enc &&
      chmod u+s /bin/cp &&
      echo 'PermitRootLogin no' >> /etc/ssh/sshd_config &&
      echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config &&
      echo 'Port 22' >> /etc/ssh/sshd_config &&
      service ssh start &&
      tail -f /dev/null"
    networks:
      lab_network:
        ipv4_address: 10.10.13.12
    restart: unless-stopped

  database:
    image: mariadb:10.11
    container_name: altfinal2026-db
    hostname: vanta-db
    environment:
      - MARIADB_ROOT_PASSWORD=rootV@nta!2026
      - MARIADB_DATABASE=vanta_db
      - MARIADB_USER=vhealth_app
      - MARIADB_PASSWORD=V@nta_db#2026
    volumes:
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      lab_network:
        ipv4_address: 10.10.13.13
    restart: unless-stopped

networks:
  lab_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.13.0/24
