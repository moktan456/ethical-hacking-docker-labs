services:
  # Wireshark's HTML5 (KasmVNC) GUI from LinuxServer.io — multi-arch, so it
  # runs natively on both Intel and Apple Silicon. Browse to
  # http://localhost:14500 (no password by default).
  #
  # NOTE 1: this previously used ffeldhaus/wireshark:0.5, which is amd64-only
  # and fails under emulation on Apple Silicon. Switched to the multi-arch
  # LinuxServer image (same one week 3 uses) to fix that.
  # NOTE 2: it also previously forced a static IP (10.10.1.2) and sat behind a
  # dead HAProxy proxy. The static .2 address collides with Docker Desktop's
  # bridge gateway on some hosts ("failed to set up container networking:
  # Address already in use"), and nothing depends on a fixed address, so it
  # now takes a dynamic IP on the network.
  wireshark:
    image: lscr.io/linuxserver/wireshark:latest
    container_name: wireshark
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "14500:3000"
    volumes:
      - ./data:/config
      - ./data:/home/wireshark:ro
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    networks:
      - custom_network

  # NOTE: michaelborck/secutils was retired from Docker Hub (image no longer
  # exists — `docker compose up` would fail here). Replaced with LinuxServer's
  # webtop image, which serves the same purpose (browser-accessible desktop
  # for a GUI "admin box"). Same port/credentials as before so the lab docs
  # still apply. The CTF root flag is now delivered via a mounted file instead
  # of the dead image's custom entrypoint.
  secutils:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: secutils
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"
    ports:
      - "6080:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CUSTOM_USER=root
      - PASSWORD=rootpassword
    volumes:
      - ./data:/root/Desktop/data
      - ./secutils-flag/root.txt:/root/root.txt:ro
      - ./secutils-init:/custom-cont-init.d:ro
    networks:
      custom_network:
        ipv4_address: 10.10.1.5

  attacker:
    image: ethical-base
    container_name: week1-attacker
    stdin_open: true
    tty: true
    networks:
      - custom_network
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined

networks:
  custom_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.1.0/24
