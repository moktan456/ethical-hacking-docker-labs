services:
  week6-attacker:
    image: ethical-base
    container_name: week6-attacker
    hostname: hacklab
    stdin_open: true
    tty: true
    networks:
      week6-labnet:
        ipv4_address: 10.10.6.2
    volumes:
      - ./wordlists:/wordlists
      - ./hashes:/hashes
      - ./scripts:/scripts
    command: /bin/bash -c "
      pip3 install --break-system-packages zxcvbn &&
      echo 'Lab environment ready!' &&
      /bin/bash"
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE

  ssh-target:
    image: ubuntu:22.04
    container_name: ssh-target
    hostname: target-server
    environment:
      - DEBIAN_FRONTEND=noninteractive
    networks:
      week6-labnet:
        ipv4_address: 10.10.6.10
    command: /bin/bash -c "
      apt-get update &&
      apt-get install -y openssh-server &&
      mkdir -p /var/run/sshd &&
      ssh-keygen -A &&
      echo 'root:password123' | chpasswd &&
      useradd -m admin && echo 'admin:letmein' | chpasswd &&
      useradd -m user1 && echo 'user1:qwerty' | chpasswd &&
      mkdir -p /home/admin &&
      echo 'flag{w6_password_cracked_ssh}' > /home/admin/user.txt &&
      echo 'flag{w6_root_shell_obtained}' > /root/root.txt &&
      sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
      sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
      echo 'SSH Target Server Ready' &&
      /usr/sbin/sshd -D"

  web-target:
    image: python:3.12-alpine
    container_name: web-target
    hostname: web-server
    networks:
      week6-labnet:
        ipv4_address: 10.10.6.11
    ports:
      - "8080:80"
    volumes:
      - ./web-target:/app:ro
    command: python3 /app/login_server.py

networks:
  week6-labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.6.0/24
