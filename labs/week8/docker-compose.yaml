services:
  attacker:
    image: ethical-base
    container_name: week8-attacker
    stdin_open: true
    tty: true
    networks:
      security_net:
        ipv4_address: 10.10.8.2
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined

  # Target 1: initial access via web recon (username hidden in HTML source)
  # + SSH weak-password brute force (Hydra), then privesc via SUID `find`
  # binary + writable cron job
  workstation:
    image: ubuntu:22.04
    container_name: week8-workstation
    hostname: workstation
    environment:
      - DEBIAN_FRONTEND=noninteractive
    command: >
      /bin/bash -c "
      apt-get update &&
      apt-get install -y cron sudo openssh-server nginx &&
      useradd -m -s /bin/bash lowpriv &&
      echo 'lowpriv:sunshine1' | chpasswd &&
      sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
      sed -i 's/PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config &&
      ssh-keygen -A &&
      chmod u+s /usr/bin/find &&
      mkdir -p /opt/scripts &&
      echo '#!/bin/bash' > /opt/scripts/backup.sh &&
      echo 'tar -czf /root/backup.tar.gz /var/log 2>/dev/null' >> /opt/scripts/backup.sh &&
      chmod 777 /opt/scripts/backup.sh &&
      echo '* * * * * root /opt/scripts/backup.sh' > /etc/cron.d/backup &&
      chmod 644 /etc/cron.d/backup &&
      echo 'flag{w8_suid_or_cron_root}' > /root/user.txt &&
      chmod 600 /root/user.txt &&
      echo '<html><head><title>Workstation Portal</title></head><body>' > /var/www/html/index.html &&
      echo '<h1>IT Notice</h1>' >> /var/www/html/index.html &&
      echo '<p>This workstation is being prepared for a new contractor onboarding.</p>' >> /var/www/html/index.html &&
      echo '<p>A temporary low-privilege account has been provisioned for initial setup access.</p>' >> /var/www/html/index.html &&
      echo '<p>Contact IT with any issues.</p>' >> /var/www/html/index.html &&
      echo '<!-- account: lowpriv -->' >> /var/www/html/index.html &&
      echo '</body></html>' >> /var/www/html/index.html &&
      service nginx start &&
      service ssh start &&
      cron -f"
    networks:
      security_net:
        ipv4_address: 10.10.8.10
    restart: unless-stopped

  # Target 2: initial access via an anonymous SMB share leaking a
  # credential in a sysadmin note, then privesc via sudo NOPASSWD
  # GTFOBins binary + password reuse to root
  ubuntu-desktop:
    image: ubuntu:22.04
    container_name: week8-ubuntu-desktop
    hostname: ubuntu-desktop
    environment:
      - DEBIAN_FRONTEND=noninteractive
    command: >
      /bin/bash -c "
      apt-get update &&
      apt-get install -y sudo less openssh-server samba &&
      useradd -m -s /bin/bash deskuser &&
      echo 'deskuser:Winter2024!' | chpasswd &&
      sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
      sed -i 's/PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config &&
      ssh-keygen -A &&
      echo 'deskuser ALL=(ALL) NOPASSWD: /usr/bin/less' >> /etc/sudoers &&
      mkdir -p /etc/app &&
      echo 'db_host=127.0.0.1' > /etc/app/db.conf &&
      echo 'db_user=appsvc' >> /etc/app/db.conf &&
      echo 'root_password=CorrectHorseBattery42' >> /etc/app/db.conf &&
      chmod 644 /etc/app/db.conf &&
      echo 'root:CorrectHorseBattery42' | chpasswd &&
      echo 'flag{w8_gtfobins_sudo_root}' > /root/root.txt &&
      chmod 600 /root/root.txt &&
      mkdir -p /srv/notices &&
      echo 'IT Helpdesk Notice - Workstation Migration' > /srv/notices/notice.txt &&
      echo '' >> /srv/notices/notice.txt &&
      echo 'A temporary account (deskuser) has been created on this machine' >> /srv/notices/notice.txt &&
      echo 'for the migration project. Login: deskuser / Winter2024!' >> /srv/notices/notice.txt &&
      echo 'Please change this password after first login. Ticket #4521.' >> /srv/notices/notice.txt &&
      echo '' >> /srv/notices/notice.txt &&
      echo '-- IT Support' >> /srv/notices/notice.txt &&
      chmod -R 755 /srv/notices &&
      printf '[global]\n   workgroup = WORKGROUP\n   server string = Ubuntu Desktop\n   security = user\n   map to guest = Bad User\n   guest account = nobody\n   log file = /var/log/samba/log.%%m\n\n[notices]\n   path = /srv/notices\n   browseable = yes\n   read only = yes\n   guest ok = yes\n' > /etc/samba/smb.conf &&
      service smbd start &&
      service ssh start &&
      tail -f /dev/null"
    networks:
      security_net:
        ipv4_address: 10.10.8.11
    restart: unless-stopped

networks:
  security_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.8.0/24
